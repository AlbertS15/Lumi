name: Android

# Builds the Android app and runs its unit tests. A manual run with "publish" also puts the APK
# on the android-preview pre-release, so it can be installed on a phone without a GitHub account.
on:
  push:
    branches: [main, android]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK to the android-preview pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        working-directory: android
        env:
          LUMI_BUILD: ${{ github.run_number }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Lumi-android-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-android
          path: Lumi-android-*.apk
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls Lumi-android-*.apk)
          if gh release view android-preview >/dev/null 2>&1; then
            for old in $(gh release view android-preview --json assets -q '.assets[].name'); do gh release delete-asset android-preview "$old" -y; done
            gh release upload android-preview "$apk"
          else
            gh release create android-preview "$apk" --prerelease --target "$GITHUB_SHA" \
              --title "Lumi for Android (preview)" \
              --notes "Test build of Lumi for Android. Download the APK on your phone and open it to install."
          fi
