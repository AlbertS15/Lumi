name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Unit tests (chunking, ranking, index, text extraction)
        run: dotnet test windows/Lumi.Tests/Lumi.Tests.csproj -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Publish single-file exe
        run: >
          dotnet publish windows/Lumi/Lumi.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.APP_VERSION }} -o dist/app

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc windows/installer/Lumi.iss
          Copy-Item dist/app/Lumi.exe "dist/Lumi-Portable-${env:APP_VERSION}.exe"

      - name: Smoke test (launch, hotkey, search, ask)
        shell: powershell
        run: ./windows/ci/smoke.ps1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-screenshots
          path: dist/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-Windows
          path: |
            dist/Lumi-Setup-*.exe
            dist/Lumi-Portable-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export LUMI_VERSION="${GITHUB_REF#refs/tags/v}"; else export LUMI_VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          ./build.sh
          mkdir -p dist/dmg
          cp -R build/Lumi.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Lumi -srcfolder dist/dmg -ov -format UDZO dist/Lumi-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-macOS
          path: dist/Lumi-macOS.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build AppImage, .deb and .rpm
        run: ./linux/package.sh

      - name: Check the .deb installs and the .rpm reads
        run: |
          sudo apt-get install -y -qq ./dist/Lumi-*-amd64.deb rpm > /dev/null
          ls -la /usr/bin/lumi /usr/share/applications/lumi.desktop /usr/share/pixmaps/lumi.png
          rpm -qip dist/Lumi-*-x86_64.rpm
          rpm -qlp dist/Lumi-*-x86_64.rpm

      - name: Smoke test (launch, toggle, search)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick dbus-x11 > /dev/null
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session ./linux/ci/smoke.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-screenshots
          path: dist/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-Linux
          path: |
            dist/Lumi-x86_64.AppImage
            dist/Lumi-*-amd64.deb
            dist/Lumi-*-x86_64.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Lumi-*
          path: dist
          merge-multiple: true

      - name: Release notes
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.html"
          if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}

      - name: Post to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && steps.notes.outputs.file != ''
        run: python3 .github/scripts/telegram.py "$GITHUB_REF_NAME"
