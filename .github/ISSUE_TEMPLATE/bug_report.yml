name: Bug report / Сообщить об ошибке
description: Something doesn't work as it should / Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English or Russian.
        Спасибо, что сообщаете! Можно писать по-русски.

        ⚠️ Never paste API keys or tokens here — screenshots too. / Не вставляйте сюда API-ключи и токены, в том числе на скриншотах.
  - type: input
    id: os
    attributes:
      label: System / Система
      description: Filled in automatically from Lumi's menu → "Report a problem…". / Заполняется само, если открыть через меню Lumi → «Сообщить об ошибке…».
      placeholder: "macOS 15.4 / Windows 11 / Ubuntu 24.04, GNOME (wayland)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lumi version / Версия Lumi
      description: |
        Easiest: Lumi's menu → "Report a problem…" fills it in. / Проще всего: меню Lumi → «Сообщить об ошибке…» — заполнится само.
      placeholder: "2.0.0"
  - type: input
    id: model
    attributes:
      label: Model / Модель
      description: Or "not about models" (search, hotkey, install). / Или «не про модели» (поиск, клавиша, установка).
      placeholder: "Claude / lumi / OpenRouter / …"
  - type: textarea
    id: what
    attributes:
      label: What happened? / Что случилось?
      description: What you did, what you expected and what happened instead. / Что вы сделали, что ожидали и что получилось.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or error text / Скриншот или текст ошибки
      description: Drag a screenshot here. / Перетащите сюда скриншот.
